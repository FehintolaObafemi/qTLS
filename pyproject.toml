[build-system]
# >= 77 for the PEP 639 string `license = "MIT"`.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "qtls"
version = "0.0.1"
description = "Research prototype: KEM-authenticated, post-quantum TLS 1.3 over Merkle Tree Certificates"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    # >= 48 is the first release with ML-KEM and ML-DSA. Exact pin: results
    # depend on the bundled OpenSSL build.
    "cryptography==50.0.2",
]

[project.optional-dependencies]
# Native liboqs is NOT installed by this. Build it with scripts/build_liboqs.sh.
oqs = ["liboqs-python==0.16.0.2"]
test = ["pytest==9.2.0"]
notebooks = ["jupyter==1.1.1", "matplotlib==3.11.2"]
# Pinned in the CI lock so the editable install builds without fetching anything unhashed.
build = ["setuptools==84.2.1"]

[tool.setuptools.packages.find]
include = ["qtls*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
# Turns liboqs-python's version-mismatch warning (and any other) into a failure.
filterwarnings = ["error"]
markers = [
    "liboqs: needs the pinned liboqs build (OQS_INSTALL_PATH)",
]
