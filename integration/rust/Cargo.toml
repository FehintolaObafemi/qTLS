[package]
name = "qtls-core"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
log = "0.4"
env_logger = "0.10"
rand = "0.8"
sha2 = "0.10"
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
x25519-dalek = "2.0"
p256 = "0.13"
rsa = "0.9"
base64 = "0.21"
hex = "0.4"
async-trait = "0.1"

[dev-dependencies]
tokio-test = "0.4"
criterion = "0.5"
chrono = "0.4"

[[bench]]
name = "qkd_benchmarks"
harness = false 