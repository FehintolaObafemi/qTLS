name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    env:
      OQS_INSTALL_PATH: ${{ github.workspace }}/.oqs
      QTLS_OPENSSL_PREFIX: ${{ github.workspace }}/.openssl
      QTLS_OPENSSL: ${{ github.workspace }}/.openssl/bin/openssl
      # The OpenSSL interop and oracle tests must run, not just not skip (tests/conftest.py).
      QTLS_MIN_OPENSSL_TESTS: "40"
      # Likewise the live differential against the WG's Go demo (tests/test_mtc_go.py; specs.md D34).
      QTLS_GO_DEMO: ${{ github.workspace }}/.mtc-demo/demo
      QTLS_MIN_GO_TESTS: "16"
      # The pinned toolchain only: `go` must never download another one.
      GOTOOLCHAIN: local
      # Any skipped test fails the run, so crypto can't be silently bypassed.
      QTLS_NO_SKIPS: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pinned liboqs build
        uses: actions/cache@v4
        with:
          path: .oqs
          key: liboqs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build_liboqs.sh') }}

      # A separate step, so a build failure is reported here instead of
      # aborting pytest collection.
      - name: Build liboqs (pinned commit)
        run: scripts/build_liboqs.sh

      - name: Cache pinned OpenSSL build
        uses: actions/cache@v4
        with:
          path: .openssl
          key: openssl-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build_openssl.sh') }}

      # The independent TLS stack for the interop, capture and x509 oracle tests.
      - name: Build OpenSSL (pinned commit)
        run: scripts/build_openssl.sh

      - name: Cache pinned Go toolchain
        uses: actions/cache@v4
        with:
          path: .go
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/install_go.sh') }}

      # The tarball's SHA-256 is checked against the script's table.
      - name: Install Go (pinned version and hash)
        run: scripts/install_go.sh

      - name: Install locked dependencies
        run: |
          python -m pip install --require-hashes -r requirements/ci.txt
          python -m pip install --no-deps --no-build-isolation -e .

      # The MTC WG's Go demo at its pinned tag and commit: the independent oracle of the go-marked tests.
      - name: Build the MTC demo (pinned commit)
        run: python scripts/mtc_demo.py --build-only

      - name: Run tests
        run: python -m pytest

      # A failed live differential keeps its working directory (certificates, policies, Go's output);
      # `python scripts/mtc_demo.py --replay <dir>` re-runs the comparison from it.
      - name: Upload the failed MTC differential
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mtc-differential-failed-py${{ matrix.python-version }}
          path: .mtc-demo/failed/
          if-no-files-found: ignore
